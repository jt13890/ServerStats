services:
  serverstats:
    build: .
    image: serverstats:latest
    container_name: serverstats
    restart: unless-stopped
    volumes:
      - ./config:/config:ro      # config.yaml lives here
      - serverstats-data:/data   # SQLite history, SSH key, pinned host keys
    # Don't publish the port to the internet: everything except the agent
    # endpoints should only be reachable through Authentik. Bind to localhost
    # (or drop "ports" entirely and attach the container to your proxy's
    # Docker network - see README).
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  serverstats-data:
