# ServerStats configuration. Copy to ./config/config.yaml and restart the
# container after editing.

settings:
  # Mark a host offline when it hasn't reported for this many seconds, or for
  # 3x its reporting/poll interval if that's longer.
  stale_after: 60
  # History is kept forever (older data as hourly averages, a few MB per host
  # per year). Delete old history with "Prune" in the dashboard.
  # Default poll interval for SSH hosts (seconds).
  ssh_interval: 15
  # Report at most this many processes per host (busiest first).
  max_procs: 500
  # Header your reverse proxy sets with the signed-in user (shown in the UI).
  auth_header: X-authentik-username
  # Reject UI/API requests that lack auth_header (agent endpoints excepted).
  # Defense in depth against the UI being reached without going through
  # Authentik. Set to false only for local testing without a proxy.
  require_auth_header: true
  # Let agents join with the join key shown under "Add host" (no need to list
  # them below). Set to false to only allow the hosts listed here.
  enrollment: true

# Hosts that join with the join key don't need to be listed here.
hosts:
  # Push agent with a fixed token (optional; joining is easier). Generate a token per host with:
  #   openssl rand -hex 32
  # then run the installer on the host (the "Add host" button in the UI
  # generates both for you).
  - name: nas
    description: Storage box
    mode: agent
    token: CHANGE-ME-0123456789abcdef0123456789abcdef

  # SSH pull: run the installer on the host with --ssh-key (the "Add host"
  # button shows the command). The key is locked to the collector with a
  # forced command; hosts where it isn't are refused.
  - name: pi
    mode: ssh
    address: 192.168.1.20
    port: 22
    user: serverstats
    # interval: 30            # override ssh_interval for this host
    # host_key: "SHA256:..."  # pin the host key instead of trust-on-first-use
